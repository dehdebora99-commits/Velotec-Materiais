<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velotec Materiais</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:#f5f8fa;
  color:#172b3a;
}

header{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 85% 20%,rgba(255,255,255,.15),transparent 28%),
    radial-gradient(circle at 10% 90%,rgba(255,255,255,.08),transparent 30%),
    linear-gradient(135deg,#164e63,#217895 55%,#4a9db8);
  color:white;
  padding:58px 20px 66px;
  text-align:center;
}

header h1{
  font-size:40px;
  margin-bottom:10px;
}

header p{
  max-width:720px;
  margin:0 auto;
  line-height:1.6;
  color:rgba(255,255,255,.92);
}

main{
  max-width:1120px;
  margin:-24px auto 0;
  padding:0 20px 50px;
  position:relative;
  z-index:2;
}

.toolbar{
  background:white;
  border:1px solid #e1ebef;
  border-radius:22px;
  padding:22px;
  box-shadow:0 10px 30px rgba(22,78,99,.08);
  margin-bottom:24px;
}

.toolbar input{
  width:100%;
  padding:13px 14px;
  border:1px solid #cfe0e8;
  border-radius:12px;
  font-size:15px;
  font-family:inherit;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:22px;
}

.card{
  background:white;
  border:1px solid #e1ebef;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 8px 24px rgba(22,78,99,.07);
  display:flex;
  flex-direction:column;
  min-height:100%;
  transition:transform .2s ease,box-shadow .2s ease;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 16px 34px rgba(22,78,99,.12);
}

.capa-wrap{
  width:100%;
  aspect-ratio:4/3;
  background:#edf5f8;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.capa-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.sem-capa{
  font-size:48px;
  color:#7da6b6;
}

.conteudo{
  padding:22px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.card h2{
  color:#174f65;
  font-size:21px;
  line-height:1.3;
  margin-bottom:10px;
}

.card p{
  color:#647481;
  line-height:1.65;
  font-size:14.5px;
  margin-bottom:20px;
  flex:1;
}

.download{
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:#174f65;
  color:white;
  border-radius:12px;
  padding:13px 14px;
  font-weight:700;
  font-size:14px;
  transition:.2s;
}

.download:hover{
  background:#217895;
}

.empty{
  display:none;
  background:white;
  border:1px dashed #b9d0da;
  border-radius:18px;
  padding:30px;
  text-align:center;
  color:#6f808c;
}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:650px){
  .grid{grid-template-columns:1fr}
  header h1{font-size:31px}
  main{padding-left:15px;padding-right:15px}
}
</style>
</head>
<body>

<header>
  <h1>📚 Velotec Materiais</h1>
  <p>Materiais pedagógicos disponíveis para consulta e download em PDF.</p>
</header>

<main>
  <section class="toolbar">
    <input id="busca" type="search" placeholder="Pesquisar material..." oninput="filtrar()">
  </section>

  <section id="lista" class="grid"></section>
  <div id="vazio" class="empty">Nenhum material encontrado.</div>
</main>

<script>
let materiais = [];

async function carregarCatalogo(){
  try{
    const resp = await fetch('materiais.json', {cache:'no-store'});
    if(!resp.ok) throw new Error();
    materiais = await resp.json();
    renderizar(materiais);
  }catch(e){
    document.getElementById('lista').innerHTML = '';
    const vazio = document.getElementById('vazio');
    vazio.style.display='block';
    vazio.textContent='Nenhum material cadastrado no momento.';
  }
}

function escapar(txt){
  return String(txt || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[c]));
}

function renderizar(lista){
  const container = document.getElementById('lista');
  const vazio = document.getElementById('vazio');
  container.innerHTML='';

  if(!lista.length){
    vazio.style.display='block';
    vazio.textContent='Nenhum material encontrado.';
    return;
  }

  vazio.style.display='none';

  lista.forEach(item=>{
    const card = document.createElement('article');
    card.className='card';

    const capa = item.imagem
      ? `<img src="${escapar(item.imagem)}" alt="Capa do material ${escapar(item.titulo)}">`
      : `<div class="sem-capa">📘</div>`;

    card.innerHTML = `
      <div class="capa-wrap">${capa}</div>
      <div class="conteudo">
        <h2>${escapar(item.titulo)}</h2>
        <p>${escapar(item.descricao)}</p>
        <a class="download" href="${escapar(item.arquivo)}" download>
          ⬇ Baixar PDF
        </a>
      </div>
    `;

    container.appendChild(card);
  });
}

function filtrar(){
  const termo = document.getElementById('busca').value.toLowerCase().trim();
  const filtrados = materiais.filter(item => {
    const texto = `${item.titulo || ''} ${item.descricao || ''}`.toLowerCase();
    return texto.includes(termo);
  });
  renderizar(filtrados);
}

carregarCatalogo();
</script>
</body>
</html>
